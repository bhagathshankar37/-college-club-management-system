{% extends "base.html" %}

{% block title %}Create Account - CampusClubs{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="custom-card-no-hover shadow-lg p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Student Registration</h3>
                    <p class="text-muted small">Join your campus community to discover clubs and participate in events</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="full_name" class="form-label fw-semibold small">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control" id="full_name" name="full_name" placeholder="e.g. Jordan Miller" required autofocus>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="username" class="form-label fw-semibold small">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-at text-muted"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="jordanm" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold small">College Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="jordan@college.edu" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="department" class="form-label fw-semibold small">Department / Major</label>
                            <select class="form-select" id="department" name="department" required>
                                <option value="Computer Science" selected>Computer Science & Eng</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Electronics & Communication">Electronics & Comm.</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                                <option value="Civil Engineering">Civil Engineering</option>
                                <option value="Business Administration">Business Administration</option>
                                <option value="Design & Media">Design & Media</option>
                                <option value="Biotechnology">Biotechnology</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="year_of_study" class="form-label fw-semibold small">Year of Study</label>
                            <select class="form-select" id="year_of_study" name="year_of_study" required>
                                <option value="1st Year" selected>1st Year (Freshman)</option>
                                <option value="2nd Year">2nd Year (Sophomore)</option>
                                <option value="3rd Year">3rd Year (Junior)</option>
                                <option value="4th Year">4th Year (Senior)</option>
                                <option value="Postgraduate">Postgraduate</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label fw-semibold small">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-check2-circle text-muted"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm password" minlength="6" required>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary-custom w-100 py-2">
                            <i class="bi bi-person-check-fill me-1"></i> Register Student Account
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="small text-muted mb-0">Already registered? 
                        <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign In to Account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
