{% extends "base.html" %}

{% block title %}Sign In - CampusClubs{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="custom-card-no-hover shadow-lg p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                        <i class="bi bi-box-arrow-in-right fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Log in to manage your clubs, events, and registrations</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold small">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="e.g. admin or alex" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold small mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Account
                    </button>
                </form>

                <!-- Demo Accounts Helper -->
                <div class="demo-accounts-card mt-3">
                    <div class="d-flex align-items-center gap-1 mb-2">
                        <i class="bi bi-lightning-charge-fill text-warning"></i>
                        <span class="small fw-bold text-dark">One-Click Demo Test Accounts:</span>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="demo-chip" onclick="quickLogin('admin', 'Admin@123')">
                            <i class="bi bi-shield-lock-fill text-danger"></i> Admin
                        </button>
                        <button type="button" class="demo-chip" onclick="quickLogin('coding_lead', 'Coord@123')">
                            <i class="bi bi-code-slash text-primary"></i> Coding Coord
                        </button>
                        <button type="button" class="demo-chip" onclick="quickLogin('ai_lead', 'Coord@123')">
                            <i class="bi bi-cpu text-info"></i> AI Coord
                        </button>
                        <button type="button" class="demo-chip" onclick="quickLogin('alex', 'Student@123')">
                            <i class="bi bi-person-fill text-success"></i> Alex (Student)
                        </button>
                        <button type="button" class="demo-chip" onclick="quickLogin('priya', 'Student@123')">
                            <i class="bi bi-person-fill text-success"></i> Priya (Student)
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="small text-muted mb-0">Don't have an account? 
                        <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Create a Student Account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
