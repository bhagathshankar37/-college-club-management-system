{% extends "base.html" %}

{% block title %}New Announcement - CampusClubs{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{{ url_for('coordinator_dashboard') }}">Coordinator Hub</a></li>
                    <li class="breadcrumb-item active" aria-current="page">New Announcement</li>
                </ol>
            </nav>

            <div class="custom-card-no-hover p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="stat-icon-wrapper stat-icon-warning">
                        <i class="bi bi-megaphone-fill"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0">Post Club Announcement</h3>
                        <p class="text-muted small mb-0">Publish an update to your club members and campus feed.</p>
                    </div>
                </div>

                <form method="POST">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="title" class="form-label small fw-semibold">Announcement Title</label>
                            <input type="text" class="form-control" id="title" name="title" placeholder="e.g. Core Team Recruitment Interviews / Venue Change" required autofocus>
                        </div>

                        <div class="col-12">
                            <label for="priority" class="form-label small fw-semibold">Priority Level</label>
                            <select class="form-select" id="priority" name="priority" required>
                                <option value="normal" selected>Normal Update (Standard notice)</option>
                                <option value="important">Important (Highlighted in feed)</option>
                                <option value="urgent">Urgent / Action Required</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="content" class="form-label small fw-semibold">Announcement Message</label>
                            <textarea class="form-control" id="content" name="content" rows="6" placeholder="Write full details, timings, instructions, or external links..." required></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                        <a href="{{ url_for('coordinator_dashboard') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary-custom">
                            <i class="bi bi-send-fill me-1"></i> Publish Announcement
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
