{% extends "base.html" %}

{% block title %}Server Error (500) - CampusClubs{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="custom-card-no-hover p-5 my-4">
                <div class="text-danger mb-3">
                    <i class="bi bi-exclamation-octagon fs-1" style="font-size: 4.5rem !important;"></i>
                </div>
                <h1 class="display-4 fw-bold mb-2">500</h1>
                <h3 class="fw-bold mb-3">Internal Server Error</h3>
                <p class="text-muted mb-4">Something went wrong processing your request. Please try again in a moment or navigate back to the home page.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('index') }}" class="btn btn-primary-custom">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
